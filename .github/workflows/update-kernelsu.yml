name: Update KernelSU

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kernelsu
  cancel-in-progress: false

jobs:
  update-kernelsu:
    runs-on: ubuntu-latest
    # Only run schedule on bpf-5.10-phoenix; allow manual dispatch from any branch
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/bpf-5.10-phoenix'
    steps:
      - name: Checkout bpf-5.10-phoenix
        uses: actions/checkout@v4
        with:
          ref: bpf-5.10-phoenix
          fetch-depth: 0
          submodules: false

      - name: Update KernelSU via setup.sh
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -

      - name: Detect changes
        id: diff
        run: |
          git status --porcelain
          echo "=== git diff ==="
          git diff --stat || true
          echo "=== git diff --cached ==="
          git diff --cached --stat || true
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage gitlink + files modified by setup.sh (drivers/kernelsu symlink, Makefile, Kconfig)
          git add KernelSU || true
          git add drivers/Makefile drivers/Kconfig || true
          # Symlink drivers/kernelsu is inside drivers/; add if it was created/modified
          git add drivers/kernelsu || true

          # Show what will be committed
          git status
          git diff --cached --stat

          KSU_SHA=$(git -C KernelSU rev-parse --short HEAD 2>/dev/null || echo "unknown")
          git commit -m "chore: bump KernelSU to ${KSU_SHA} [skip ci]" || echo "nothing to commit"

          # Rebase onto latest remote to avoid non-fast-forward when both bots run concurrently
          git pull --rebase origin bpf-5.10-phoenix || true

          # Push with retry once on failure
          git push origin HEAD:bpf-5.10-phoenix || (git pull --rebase origin bpf-5.10-phoenix && git push origin HEAD:bpf-5.10-phoenix)
