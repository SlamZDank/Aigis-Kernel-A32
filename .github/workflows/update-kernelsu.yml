name: Update KernelSU

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kernelsu
  cancel-in-progress: false

jobs:
  update-kernelsu:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/bpf-5.10-phoenix'
    steps:
      - name: Checkout bpf-5.10-phoenix
        uses: actions/checkout@v4
        with:
          ref: bpf-5.10-phoenix
          fetch-depth: 0
          submodules: false

      - name: Update KernelSU via setup.sh
        run: |
          set -euo pipefail
          # Ensure submodule is initialized (checkout uses submodules: false)
          git submodule update --init --depth 1 KernelSU || git clone https://github.com/ReSukiSU/ReSukiSU KernelSU
          # Handle shallow clones like build-kernel.yml does
          if [ "$(git -C KernelSU rev-parse --is-shallow-repository 2>/dev/null || echo false)" = "true" ]; then
            git -C KernelSU fetch --unshallow --tags --prune --force origin main
          else
            git -C KernelSU fetch --tags --prune --force origin main
          fi
          git -C KernelSU checkout -B main origin/main
          git -C KernelSU reset --hard origin/main
          echo "KSU now $(git -C KernelSU rev-parse --short HEAD) origin $(git -C KernelSU rev-parse --short origin/main)"
          # Keep upstream setup.sh for symlink/Makefile/Kconfig idempotency
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash - || true

      - name: Detect changes
        id: diff
        run: |
          git status --porcelain
          echo "=== git diff ==="
          git diff --stat --ignore-submodules=none || true
          echo "=== git diff --cached ==="
          git diff --cached --stat || true
          KSU_HEAD=$(git -C KernelSU rev-parse HEAD 2>/dev/null || echo "unknown")
          KSU_INDEX=$(git rev-parse HEAD:KernelSU 2>/dev/null || echo "unknown")
          echo "KSU_INDEX=$KSU_INDEX KSU_HEAD=$KSU_HEAD"
          if [ "$KSU_HEAD" != "$KSU_INDEX" ] || ! git diff --quiet --ignore-submodules=none || ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage gitlink + files modified by setup.sh (drivers/kernelsu symlink, Makefile, Kconfig)
          git add KernelSU || true
          git add drivers/Makefile drivers/Kconfig || true
          # Symlink drivers/kernelsu is inside drivers/; add if it was created/modified
          git add drivers/kernelsu || true

          # Show what will be committed
          git status
          git diff --cached --stat

          KSU_SHA=$(git -C KernelSU rev-parse --short HEAD 2>/dev/null || echo "unknown")
          git commit -m "chore: bump KernelSU to ${KSU_SHA} [skip ci]" || echo "nothing to commit"

          # Rebase onto latest remote to avoid non-fast-forward when both bots run concurrently
          git pull --rebase origin bpf-5.10-phoenix || true

          # Push with retry once on failure
          git push origin HEAD:bpf-5.10-phoenix || (git pull --rebase origin bpf-5.10-phoenix && git push origin HEAD:bpf-5.10-phoenix)
