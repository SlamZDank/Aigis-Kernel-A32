name: Update NoMount

on:
  schedule:
    - cron: '5 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nomount:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: resukisu
            ref: main-resuki
          - variant: ksunext
            ref: main-ksun
    name: Update NoMount (${{ matrix.variant }})
    runs-on: ubuntu-latest
    concurrency:
      group: update-nomount-${{ matrix.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          submodules: false

      - name: Update NoMount via setup.sh (${{ matrix.variant }})
        run: |
          set -euo pipefail
          echo "Target branch: ${{ matrix.ref }} (${{ matrix.variant }})"
          # Ensure submodule is initialized (checkout uses submodules: false)
          git submodule sync --recursive || true
          git submodule update --init --depth 1 NoMount || git clone https://github.com/maxsteeel/nomount NoMount
          # Handle shallow clones like build-kernel.yml does
          if [ "$(git -C NoMount rev-parse --is-shallow-repository 2>/dev/null || echo false)" = "true" ]; then
            git -C NoMount fetch --unshallow --tags --prune --force || true
            git -C NoMount fetch --tags --prune --force origin '+refs/heads/*:refs/remotes/origin/*'
          else
            git -C NoMount fetch --tags --prune --force origin '+refs/heads/*:refs/remotes/origin/*'
          fi
          git -C NoMount checkout -B dev origin/dev
          git -C NoMount reset --hard origin/dev
          echo "NoMount now $(git -C NoMount rev-parse --short HEAD) origin $(git -C NoMount rev-parse --short origin/dev)"
          # Keep upstream setup.sh for symlink/Makefile/Kconfig idempotency
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash - || true

      - name: Detect changes
        id: diff
        run: |
          git status --porcelain
          echo "=== git diff ==="
          git diff --stat --ignore-submodules=none || true
          echo "=== git diff --cached ==="
          git diff --cached --stat || true
          NOMOUNT_HEAD=$(git -C NoMount rev-parse HEAD 2>/dev/null || echo "unknown")
          NOMOUNT_INDEX=$(git rev-parse HEAD:NoMount 2>/dev/null || echo "unknown")
          echo "NOMOUNT_INDEX=$NOMOUNT_INDEX NOMOUNT_HEAD=$NOMOUNT_HEAD"
          if [ "$NOMOUNT_HEAD" != "$NOMOUNT_INDEX" ] || ! git diff --quiet --ignore-submodules=none || ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          BRANCH="${{ matrix.ref }}"
          echo "Committing to branch: $BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage gitlink + files modified by setup.sh (fs/nomount symlink, Makefile, Kconfig)
          git add NoMount || true
          git add fs/Makefile fs/Kconfig || true
          git add fs/nomount || true

          git status
          git diff --cached --stat

          NOMOUNT_SHA=$(git -C NoMount rev-parse --short HEAD 2>/dev/null || echo "unknown")
          git commit -m "chore: bump NoMount to ${NOMOUNT_SHA} [skip ci]" || echo "nothing to commit"

          git pull --rebase origin "${BRANCH}" || true
          git push origin "HEAD:${BRANCH}" || (git pull --rebase origin "${BRANCH}" && git push origin "HEAD:${BRANCH}")
